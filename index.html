<!DOCTYPE html>

  <!-- 引入Tailwind CSS -->

  <!-- 引入Font Awesome图标 -->

  <!-- 自定义Tailwind配置 -->
  <script>
    tailwind.config = {
      darkMode: 'class', // 开启class模式的暗黑模式切换
      theme: {
        extend: {
          colors: {
            primary: '#165DFF', // 主色调-科技蓝（白天黑夜通用）
            secondary: '#36D399', // 辅助色-成功绿
            dark: '#1E293B',
            light: '#F8FAFC'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .card-hover {
        @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
      }
      .btn-download {
        @apply bg-primary text-white px-4 py-2 rounded-lg transition-all duration-300 hover:bg-primary/90 active:scale-95 flex items-center gap-2;
      }
      .section-title {
        @apply text-2xl md:text-3xl font-bold mb-6 flex items-center gap-2 text-dark dark:text-light;
      }
      /* 动态背景画布样式，置底不遮挡内容 */
      #bg-canvas {
        @apply fixed top-0 left-0 w-full h-full z-[-1];
      }
      /* 模式切换按钮样式 */
      .mode-toggle {
        @apply w-10 h-10 rounded-full flex items-center justify-center text-xl cursor-pointer transition-all duration-300 hover:bg-gray-200 dark:hover:bg-gray-700;
      }
    }
  </style>
</head>
<!-- 基础样式：白天浅灰背景，黑夜深灰背景，过渡平滑 -->
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300 relative overflow-x-hidden">
  <!-- 保留原动态背景核心画布 -->
  <canvas id="bg-canvas"></canvas>

  <!-- 顶部导航 - 白天黑夜适配，添加模式切换按钮 -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm shadow-sm transition-all duration-300">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center gap-4">
      <h1 class="text-xl md:text-2xl font-bold text-primary flex items-center gap-2 shrink-0">
        <i class="fas fa-download"></i>软件下载站
      </h1>
      <!-- 导航锚点 -->
      <nav class="hidden md:flex gap-6 flex-1 justify-center">
        <a href="#mobile" class="hover:text-primary transition-colors">手机端</a>
        <a href="#pc" class="hover:text-primary transition-colors">电脑端</a>
      </nav>
      <!-- 右侧功能区：模式切换 + 移动端菜单 -->
      <div class="flex items-center gap-2">

        <div class="mode-toggle" id="modeToggle">
          <i class="fas fa-sun dark:fa-moon"></i>
        </div>
        <!-- 移动端菜单按钮 -->
        <button class="md:hidden text-2xl" id="menuBtn">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
    <!-- 移动端导航菜单 - 白天黑夜适配 -->
    <div class="md:hidden hidden bg-white dark:bg-gray-800 shadow-md px-4 py-2 transition-all duration-300" id="mobileMenu">
      <a href="#mobile" class="block py-2 hover:text-primary">手机端</a>
      <a href="#pc" class="block py-2 hover:text-primary">电脑端</a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 relative z-10">
    <!-- 介绍区域 - 白天黑夜文字颜色适配 -->
    <section class="mb-12 text-center">
      <h2 class="text-3xl md:text-4xl font-bold mb-4 text-dark dark:text-white">叁土  软件分享</h2>
      <p class="text-gray-600 dark:text-gray-400 max-w-2xl mx-auto">
        整理手机端、电脑端常用实用软件，点击即可下载安装包/压缩文件
      </p>
    </section>

    <!-- 手机端软件区域 - 卡片白天黑夜适配（无需修改，本身正常） -->
    <section id="mobile" class="mb-16">
      <h3 class="section-title">
        <i class="fas fa-mobile-alt text-2xl"></i>手机端软件
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- 全能扫描王 - 白天白色卡片，黑夜深色玻璃拟态 -->
        <div class="bg-white dark:bg-gray-800/50 dark:backdrop-blur-sm dark:border dark:border-gray-700/50 rounded-xl shadow p-6 card-hover">
          <div class="flex items-center gap-4 mb-4">
            <div class="w-12 h-12 bg-primary/10 dark:bg-primary/10 rounded-full flex items-center justify-center text-primary text-2xl">
              <i class="fas fa-scanner"></i>
            </div>
            <h4 class="text-lg font-semibold text-dark dark:text-white">扫描全能王</h4>
          </div>
          <p class="text-gray-600 dark:text-gray-400 text-sm mb-6">
            手机端高效扫描工具，支持文档、照片扫描，OCR文字识别
          </p>
          <button class="btn-download w-full justify-center" 
             data-download-url="https://www.jianguoyun.com/p/DRbQmYsQy-yBDhjmuqMGIAA">
            <i class="fas fa-download"></i>
            <span>立即下载</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 电脑端软件区域 - 动态生成卡片，白天黑夜适配 -->
    <section id="pc">
      <h3 class="section-title">
        <i class="fas fa-desktop text-2xl"></i>电脑端软件
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="pcContainer">
        <!-- 由JS动态生成卡片 -->
      </div>
    </section>
  </main>

  <!-- 底部信息 - 白天黑夜适配 -->
  <footer class="bg-gray-100 dark:bg-gray-800/80 text-dark dark:text-light py-8 mt-12 relative z-10 transition-colors duration-300">
    <div class="container mx-auto px-4 text-center">
      <p class="mb-2">© 2026 软件下载站 - 精选实用软件合集</p>
      <p class="text-sm text-gray-600 dark:text-gray-400">
        所有软件仅作学习交流使用，请支持正版软件
      </p>
    </div>
  </footer>

  <script>
    // --- 动态背景逻辑（新增：粒子颜色随白天黑夜模式变化）--- 开始
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.radius = Math.random() * 2;
        }
        draw() {
            // 关键：白天粒子为浅蓝灰色，黑夜为白色，适配视觉
            const isDark = document.documentElement.classList.contains('dark');
            const particleColor = isDark 
              ? "rgba(255, 255, 255, 0.5)" 
              : "rgba(22, 93, 255, 0.4)"; // 主色调浅蓝，适配白天
            ctx.fillStyle = particleColor;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
    }

    function createParticles() {
        const count = Math.floor(window.innerWidth / 10);
        for (let i = 0; i < count; i++) particles.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            for (let j = i + 1; j < particles.length; j++) {
                const dx = p.x - particles[j].x;
                const dy = p.y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                    // 粒子连线颜色也随模式变化
                    const isDark = document.documentElement.classList.contains('dark');
                    const lineColor = isDark 
                      ? `rgba(255, 255, 255, ${1 - dist / 100})` 
                      : `rgba(22, 93, 255, ${0.8 - dist / 100})`;
                    ctx.strokeStyle = lineColor;
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        });
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    createParticles();
    animate();
    // --- 动态背景逻辑结束 ---

    // --- 核心：白天黑夜模式切换逻辑 --- 开始
    const modeToggle = document.getElementById('modeToggle');
    const htmlElement = document.documentElement;
    const MODE_KEY = 'app-color-mode'; // 本地存储键名

    // 1. 初始化模式：优先本地存储 → 系统偏好 → 默认黑夜
    function initMode() {
      const savedMode = localStorage.getItem(MODE_KEY);
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedMode) {
        htmlElement.classList.toggle('dark', savedMode === 'dark');
      } else {
        htmlElement.classList.toggle('dark', systemPrefersDark);
      }
    }

    // 2. 切换模式：更新class + 保存到本地存储 + 刷新粒子背景（视觉即时变化）
    function toggleMode() {
      const isDark = htmlElement.classList.contains('dark');
      // 切换dark类
      htmlElement.classList.toggle('dark');
      // 保存到本地存储
      localStorage.setItem(MODE_KEY, isDark ? 'light' : 'dark');
      // 重新初始化画布，粒子颜色即时变化
      initCanvas();
    }

    // 3. 绑定切换事件
    modeToggle.addEventListener('click', toggleMode);

    // 4. 页面加载时初始化
    initMode();
    // --- 模式切换逻辑结束 ---

    // --- 原有所有交互逻辑（完整保留，修复2处关键问题）--- 开始
    // 移动端菜单切换
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      const icon = menuBtn.querySelector('i');
      icon.classList.toggle('fa-bars');
      icon.classList.toggle('fa-times');
    });

    // 平滑滚动（锚点跳转）
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
          window.scrollTo({
            top: targetElement.offsetTop - 80,
            behavior: 'smooth'
          });
          // 关闭移动端菜单
          mobileMenu.classList.add('hidden');
          const icon = menuBtn.querySelector('i');
          icon.classList.remove('fa-times');
          icon.classList.add('fa-bars');
        }
      });
    });

    // ✅ 修复点1：改为【事件委托】，绑定到document，适配动态生成的下载按钮（手机+电脑端都生效）
    // 原代码只绑定初始DOM按钮，动态生成的电脑端按钮无事件，事件委托可解决所有动态元素绑定问题
    document.addEventListener('click', function (e) {
      // 判断点击的是下载按钮
      if (e.target.closest('.btn-download')) {
        const btn = e.target.closest('.btn-download');
        const downloadUrl = btn.getAttribute('data-download-url');
        const originalHtml = btn.innerHTML;
        // 按钮加载状态
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>正在下载...</span>';
        btn.disabled = true;

        // 模拟下载延迟，新标签页打开坚果云链接
        setTimeout(() => {
          window.open(downloadUrl, '_blank');
          // 恢复按钮状态
          btn.innerHTML = originalHtml;
          btn.disabled = false;
        }, 800);
      }
    });

    // ✅ 修复点2：删除滚动导航栏代码中的多余字符S，解决JS语法报错
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (window.scrollY > 50) {
        header.classList.add('shadow'); // 已删除多余的S
      } else {
        header.classList.remove('shadow');
      }
    });

 
    const pcApps = [
      { name: "网易有道翻译", icon: "fa-language", desc: "多功能翻译工具，支持多语言互译、截图翻译、文档翻译", url: "https://www.jianguoyun.com/p/DZvk9hsQy-yBDhiEu6MGIAA" },
      { name: "DPaste--剪贴板", icon: "fa-clipboard", desc: "高效剪贴板工具，支持多内容保存、快速粘贴、跨设备同步", url: "https://d-paste.com/cn/download" },
      { name: "Dev C++", icon: "fa-code", desc: "轻量级C/C++编译器，适合初学者，界面简洁、操作便捷", url: "https://www.jianguoyun.com/p/DYl1bVQQy-yBDhiFu6MGIAA" },
      { name: "Code Blocks", icon: "fa-code-branch", desc: "开源跨平台C/C++ IDE，支持多编译器，插件扩展丰富", url: "https://www.jianguoyun.com/p/【你的Code Blocks坚果云链接】" }, // 替换为自己的链接
      { name: "WIN RAR", icon: "fa-file-archive", desc: "经典压缩解压工具，支持RAR、ZIP等多种格式，压缩率高", url: "https://www.jianguoyun.com/p/DQoECVoQy-yBDhiHu6MGIAA" },
      { name: "7-zip", icon: "fa-compress", desc: "开源免费压缩工具，支持超高压缩率，兼容所有主流格式", url: "https://www.jianguoyun.com/p/【你的7-zip坚果云链接】" }, // 替换为自己的链接
      { name: "openspeed", icon: "fa-tachometer-alt", desc: "网络测速工具，精准测试网速、延迟、丢包率，操作简单", url: "https://www.jianguoyun.com/p/DeofkMAQy-yBDhiIu6MGIAA" },
      { name: "Adobe Dreamweaver CS6", icon: "fa-code", desc: "专业网页设计与开发工具，可视化编辑，支持多语言开发", url: "https://www.jianguoyun.com/p/DZ3Of7AQy-yBDhiLu6MGIAA" },
      { name: "DiskGenius64_NSIS", icon: "fa-hdd", desc: "专业磁盘分区工具，支持分区管理、数据恢复、磁盘克隆", url: "https://www.jianguoyun.com/p/DftwOC0Qy-yBDhiJu6MGIAA" },
      { name: "Proteus 8 Professional", icon: "fa-microchip", desc: "单片机仿真与PCB设计工具，电子工程必备开发软件", url: "https://www.jianguoyun.com/p/DZq8vsMQy-yBDhiMu6MGIAA" }
    ];
    
    const pcContainer = document.getElementById('pcContainer');
    // 动态生成白天黑夜适配的电脑端软件卡片
    pcApps.forEach(app => {
      pcContainer.innerHTML += `
        <div class="bg-white dark:bg-gray-800/50 dark:backdrop-blur-sm dark:border dark:border-gray-700/50 rounded-xl shadow p-6 card-hover transition-all duration-300">
          <div class="flex items-center gap-4 mb-4">
            <div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center text-primary text-2xl">
              <i class="fas ${app.icon}"></i>
            </div>
            <h4 class="text-lg font-semibold text-dark dark:text-white">${app.name}</h4>
          </div>
          <p class="text-gray-600 dark:text-gray-400 text-sm mb-6">${app.desc}</p>
          <button class="btn-download w-full justify-center" data-download-url="${app.url}">
            <i class="fas fa-download"></i>
            <span>立即下载</span>
          </button>
        </div>
      `;
    });
    // --- 原有交互逻辑结束 ---
  </script>
</body>
</html>
